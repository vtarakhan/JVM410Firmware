name: PlatformIO CI/CD for Marshall JVM410 ATmega8A ASM

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install PlatformIO Core
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade platformio

    - name: Build ASM Project
      run: pio run

    - name: Upload Firmware Artifacts
      if: github.ref == 'refs/heads/master' && github.event_name == 'push'
      uses: actions/upload-artifact@v4
      with:
        name: jvm410-m8-firmware-latest
        path: |
          .pio/build/atmega8_asm/firmware.hex
          .pio/build/atmega8_asm/firmware.eep
        retention-days: 7

    - name: Prepare Release Artifacts
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        mkdir -p release_files
        cp .pio/build/atmega8_asm/firmware.hex release_files/JVM410_M8_Firmware_${{ github.ref_name }}.hex
        cp .pio/build/atmega8_asm/firmware.eep release_files/JVM410_M8_EEPROM_${{ github.ref_name }}.eep

    - name: Create GitHub Release and Upload Assets
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          release_files/*.hex
          release_files/*.eep
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
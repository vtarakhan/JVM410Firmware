[env:atmega8_asm]
platform = atmelavr
framework = 
board = ATmega8

; Явно вказуємо архітектуру та частоту 4 МГц
board_build.mcu = atmega8
board_build.f_cpu = 4000000L

; Викликаємо Python-скрипт для генерації .eep файлу
extra_scripts = post:generate_eeprom.py

build_flags = 
    -v

upload_protocol = usbasp